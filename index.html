<style>
/* v19 2026-11-03: 'collaboration' opens an email to hello@lettersofmyheart.com. v18 2026-11-03: bottom nav added. Book product frame v7 (2026-11-01): options beside the image, image follows the page scroll (desktop),

   Data-driven from PP_SiteSettings / PP_Books / PP_Editions; colors come from settings.theme
   with brand defaults below (LOMH brand system). Reusable as an HPG author template. */
:root{--page:#F6EFE4;--text:#3A2A22;--title:#5E1020;--eyebrow:#6B3F1D;--button:#6B3F1D;--buttonHover:#4A2E1B;--buttonText:#F6EFE4;--line:#C9A55A;--panel:#E6DBCA;--card:#FFFFFF;--cardBorder:#D9CBB4;--radius:6px;

*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{background:var(--page)}
/* Safety net only (2026-11-01 phone fix): the real cause was fixed in noOrphan() and .wrap>*{min-width:0}. */

.note,.edition,.desc,.block{overflow-wrap:break-word}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.draft{font-family:var(--display);font-size:11px;letter-spacing:.18em;text-transform:uppercase;text-align:center;padding:8px;border-bottom:1px solid var(--line);color:var(--eyebrow)}

.topline{max-width:1120px;margin:0 auto;padding:28px 32px 0}

html.follow .photo{position:relative;top:0;transition:transform .12s linear}
.sent{position:absolute;left:0;width:1px;pointer-events:none;visibility:hidden}

.h3{margin:24px 0 10px}

.btn2:hover{background:var(--selectedFill)}
.samplesJump{margin:4px 0 8px}

.qbtn{width:44px;height:44px;border:0;background:transparent;color:var(--eyebrow);font-size:22px;line-height:1;cursor:pointer;font-family:var(--body)}
.qbtn[disabled]{opacity:.35;cursor:default}
.qbox input{width:48px;height:44px;border:0;border-left:1px solid var(--cardBorder);border-right:1px solid var(--cardBorder);background:transparent;text-align:center;font-family:inherit;font-size:19px;color:var(--text);-moz-appearance:textfield}

.seek::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;margin-top:-4px;border-radius:50%;background:var(--th)}
.seek::-moz-range-track{height:4px;border-radius:2px;background:var(--tr)}.seek::-moz-range-progress{height:4px;background:var(--fill)}
.seek::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:var(--th)}
.tm{flex:0 0 auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.sample .ra{display:inline-flex;align-items:center;min-height:44px;padding:0 4px;font-family:var(--body);font-size:17px;color:var(--selected);background:none;border:0;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
/* Companion song: dark red bar (as on Listen), credit, Listen On */
.pbar{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:0 22px;align-items:center;background:var(--bar);color:#F6EFE4;padding:18px 22px;border-radius:2px}
.pbar .bth{width:150px;height:150px;object-fit:cover;display:block;border:1px solid #C9A55A}
.pbar .bar{font-size:15px;color:#E9DCC7;margin-bottom:4px}
.pbar .btl{font-size:24px;line-height:1.2;color:#F6EFE4;margin-bottom:10px;text-wrap:balance}
.pbar .ctl{gap:12px}
.pbar .pbtn{color:#F6EFE4;margin:0 0 0 -10px}.pbar .pbtn svg{width:22px;height:22px}
.pbar .seek{--tr:rgba(246,239,228,.3);--fill:#F6EFE4;--th:#F6EFE4}
.pbar .tm{color:#E9DCC7;font-size:14px}
.buyS{align-self:start;display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:8px 22px;background:#F6EFE4;color:var(--bar);border:1px solid #C9A55A;border-radius:8px;font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;white-space:nowrap;cursor:pointer}
.buyS:hover{background:#FAF4E8;box-shadow:0 0 0 2px #C9A55A}
.scredit{font-size:18px;line-height:1.5;margin-top:12px;padding:0 22px;text-wrap:pretty}
.scredit a{color:inherit;text-decoration:underline;text-decoration-color:#C9A55A;text-underline-offset:3px}
#streamPart{text-align:center}
/* 'Listen On' heading: same burgundy caps as 'Companion Song' (.lpart h2), Nov 1. */
#streamPart h2{margin-bottom:16px}
.lpart#streamPart{border-top:1px solid #C9A55A;margin-top:36px;padding-top:28px}
.slinks{display:flex;flex-wrap:wrap;justify-content:center;gap:18px 40px}
.slink{flex:0 0 calc((100% - 80px)/3);display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:10px 14px;border:1px solid #C9A55A;border-radius:8px;background:var(--button);color:var(--buttonText);text-decoration:none;font-family:var(--display);font-size:16px;letter-spacing:.06em;font-variant:small-caps;text-transform:none;text-align:center;transition:background .2s}
/* All five buttons one brown; no primary/pressed look. Hover only on real pointers so a tap on iPhone/iPad doesn't leave one stuck darker. */
@media (hover:hover){.slink:hover{background:var(--buttonHover)}}
.slink:active{background:var(--button)}
.related{max-width:1120px;margin:0 auto;padding:36px 32px 56px}
.related::before{content:"";display:block;border-top:1px solid #C9A55A;margin-bottom:28px}
.related h2{font-family:var(--display);font-weight:400;font-size:22px;letter-spacing:.12em;text-transform:uppercase;color:var(--title);margin-bottom:8px}
.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:16px}
.rcard{background:var(--card);border:1px solid var(--cardBorder);border-radius:var(--radius);padding:16px 18px}
.rcard .rl{font-family:var(--display);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--eyebrow)}
.rcard .rt{font-size:21px;font-weight:600;margin:4px 0}
.rcard .rth{font-size:16px;line-height:1.4;text-wrap:pretty}
.rcard a,.rcard span.soon{display:inline-flex;align-items:center;min-height:44px;font-size:16px;color:var(--title)}
.flag{display:inline-block;font-family:var(--body);font-size:14px;line-height:1.35;color:#7a3b00;background:#fff4d6;border:1px dashed #c98a00;border-radius:4px;padding:4px 8px;margin:6px 0 10px}
.flags{margin:0 0 8px}
.vollink{display:inline-flex;align-items:center;min-height:44px;font-size:18px;color:var(--title)}
.loading{max-width:1120px;margin:0 auto;padding:80px 32px;text-align:center;font-size:18px}
@media (min-width:768px) and (max-width:1023px){
 .wrap{gap:32px;padding:20px 24px 32px}
 h1{font-size:40px}
}
@media (max-width:767px){
 .topline{padding:10px 18px 0}
 .wrap{grid-template-columns:1fr;gap:20px;padding:12px 18px 32px}
 /* Phone: image on top but capped (no vh: inside the embed vh is the frame height), not sticky. */

 .ehead{display:flex;align-items:center;gap:12px;margin-bottom:8px}.ehead .ename{margin-bottom:0}

 .listen{padding:0 18px 8px}
 .note .srow{grid-template-columns:1fr;gap:2px}

 /* Phone: poem title and reader on separate lines, no dash (Grace, Nov 1). */

 .pbar{grid-template-columns:72px minmax(0,1fr);gap:12px 12px;padding:14px}

 .related{padding:28px 18px 40px}
 .rgrid{grid-template-columns:1fr}
}
/* PHONE TEXT SIZES (2026-11-01, tablet-text): iPads in in-app browsers get Wix's 320px mobile layout
   stretched about 2.2-2.5x, so every phone px here shows up 2.5x bigger. These sizes match the native Wix
   mobile text on Home (body 16-17px, line-height 1.4-1.6, Cinzel buttons 14px, small caps labels 11-13px)
   and the Home hero carousel (label 11px, title 26px, sub 17px, button 12px). Like the carousel, the
   switch is the frame's own width (this media query measures the embed box, not the device).
   Desktop rules above are unchanged. No copy changed. */
html,body{-webkit-text-size-adjust:100%;text-size-adjust:100%}
@media (max-width:767px){
 .date{font-size:11px;letter-spacing:.18em;line-height:1.5}
 .label,.h3{font-size:11px;letter-spacing:.18em}

 h1{font-size:26px;line-height:1.1;margin-bottom:12px}

 .block li{margin-bottom:4px}
 .rows{gap:6px}
 .row{font-size:16px;line-height:1.25;gap:10px;padding:8px 12px}
 .row[aria-checked="true"]{padding:7px 11px}
 .row .dot{width:16px;height:16px}
 .row .tag{font-size:9.5px;padding:1px 5px}
 .edition .ename{font-size:18px}
 .ethumb{width:48px;height:48px}
 .edition p{font-size:16px;line-height:1.5;margin-bottom:12px}

 .sign .meta,.qmsg,.notice,.share .smsg{font-size:14px}
 .qty .ql{font-size:12px}
 .qbtn{font-size:20px}
 .qbox input{font-size:17px}
 .btn{font-size:14px;min-height:50px;padding:12px 14px}
 .btn2{font-size:12px}
 .hint,.buy .hint{font-size:15px;line-height:1.45;margin-top:18px}
 .tbd{font-size:13px}
 .note{font-size:15px;line-height:1.45;margin-top:16px}
 .note .nh{font-size:13px}
 .note .sl{font-size:12px}
 .note .sv{font-size:15px}
 .shipd{font-size:15px;line-height:1.45}
 .shipd summary{font-size:12px}
 .shipd summary::after{font-size:22px}
 .about{margin-top:22px}
 .lpart{padding-top:22px;margin-top:22px}
 .lpart#streamPart{margin-top:28px;padding-top:22px} .related::before{margin-bottom:22px}
 .lpart h2,.related h2{font-size:18px}
 .lpart .intro{font-size:16px;line-height:1.5}
 #samplesPart h2{font-size:28px}
 #samplesPart .intro,#samplesPart .tagl{font-size:16px;line-height:1.45}
 .sample .st{font-size:16px}
 .sample .ra{font-size:15px}
 .pbar .bar{font-size:13px}
 .pbar .btl{font-size:18px}
 .pbar .tm{font-size:13px}
 .buyS{font-size:13px}
 .scredit{font-size:15px;line-height:1.45}
 .slinks{gap:10px}
 .slink{font-size:15px;min-height:44px;padding:8px 12px}
 .rcard .rl{font-size:11px}
 .rcard .rt{font-size:18px}
 .rcard .rth{font-size:15px}
 .rcard a,.rcard span.soon,.vollink{font-size:15px}
 .share input{font-size:16px}

 .sbtn.snative,.sbtn.scopy{grid-column:1/-1}
 /* v6 (2026-11-03, Stacie: spacing and button sizing on phones) */

 .share .smsg:empty{display:none}

 .listen>.lpart:first-child{margin-top:12px}
 .btn{font-size:13px;letter-spacing:.04em;padding:12px 8px}

 .sample{grid-template-columns:72px minmax(0,1fr);gap:0}

/* Volume nav bar (v4, 2026-11-02): slim row at the very top of the box, above the release line.
   Links come from book.bookId (one file for all seven pages); open in the top window. */
.vnav{max-width:1120px;margin:0 auto;padding:14px 32px 0}
.vnav .vrow{display:flex;justify-content:center;align-items:center;gap:0 40px;padding-bottom:6px;border-bottom:1px solid #C9A55A}
.vnav a{display:inline-flex;align-items:center;min-height:44px;font-family:var(--body);font-size:16px;line-height:1.2;color:#5E1020;text-decoration:none;white-space:nowrap}
.vnav a:hover{text-decoration:underline;text-underline-offset:3px}
.vnav a:focus-visible{outline:2px solid var(--selected);outline-offset:3px}
.vnav .vp{justify-self:end}.vnav .vh{justify-self:center}.vnav .vx{justify-self:start}
.vnav .vs{display:none}
.vnav .vrow>span:empty{display:none}
.vnav.vbot{padding:0 32px 28px}.vnav.vbot .vrow{border-bottom:0;border-top:1px solid #C9A55A;padding:6px 0 0}/* v18: bottom nav */
@media (max-width:767px){.vnav{padding:10px 18px 0}.vnav .vrow{padding-bottom:2px}.vnav.vbot{padding:0 18px 22px}.vnav.vbot .vrow{padding:2px 0 0}}
@media (max-width:599px){.vnav .vrow{display:flex;justify-content:center;gap:0 24px}.vnav .vl{display:none}.vnav .vs{display:inline}.vnav .vrow>span:empty{display:none}}
/* v20 2026-11-11 (Stacie): Peek Inside button on its own just below the image card, outside the beige border.
   It moves with the card on desktop. Shown only when the page code says the Peek Inside lightbox is wired (payload message peekInside:true). */
.peek{position:absolute;left:50%;top:calc(100% + 16px);transform:translateX(-50%);width:min(300px,100%);min-height:46px;display:flex;align-items:center;justify-content:center;padding:0 16px;background:#6B3F1D;color:#F6EFE4;border:1px solid #6B3F1D;border-radius:8px;font-family:'Cinzel',Georgia,serif;font-weight:700;font-size:13px;line-height:1.2;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;cursor:pointer;transition:background .2s,border-color .2s}
@media (hover:hover){.peek:hover{background:#4A2E1B;border-color:#4A2E1B}}
.peek:active{background:#4A2E1B;border-color:#4A2E1B}
.peek:focus-visible{outline:2px solid var(--selected);outline-offset:3px}
html.hasPeek .photo{margin-bottom:62px}
@media (max-width:767px){html.hasPeek .photo{position:relative;top:0;margin-bottom:58px}.peek{top:calc(100% + 14px);width:272px;max-width:calc(100vw - 36px);min-height:44px}}
/* Fix A: show the first-screen shell (cover, title, and matching chrome) before the payload arrives. */

html.shell #vnav{display:block!important}
html.shell #topline{display:block!important}
html.shell #main{display:grid!important}
html.shell #about,
html.shell #share,
html.shell #eDesc,
html.shell #note,
html.shell #notifySlot,
html.shell #shipDetails,
html.shell #eFlags,
html.shell #eShip,
html.shell #hint,
html.shell #notice,
html.shell #tbd,
html.shell #sign,
html.shell #qty,
html.shell #samplesJumpWrap,
html.shell #volLinkWrap,
html.shell #listen,
html.shell #related,
html.shell #vnavB{display:none!important}
html.shell.shell-comingSoon #choices,
html.shell.shell-comingSoon #chooseLabel,
html.shell.shell-comingSoon #peekBtn,
html.shell.shell-comingSoon #thumbs,
html.shell.shell-comingSoon #eHead,
html.shell.shell-comingSoon #ePriceRow,
html.shell.shell-comingSoon #eName,
html.shell.shell-comingSoon #ePrice,
html.shell.shell-comingSoon #ePriceNote,
html.shell.shell-comingSoon #buyBtn,
html.shell.shell-comingSoon #buyWrap{display:none!important}
html.shell.shell-comingSoon #notifySlot{display:block!important}
html.shell.shell-comingSoon #edition{padding-bottom:20px}
html.shell.shell-comingSoon #edition.notifyOnly .notify{margin-top:0}
html.shell.shell-available #notifySlot,
html.shell.shell-available #peekBtn{display:none!important}
html.shell.shell-available.hasPeek #peekBtn{display:flex!important}
html.shell.shell-available #thumbs{min-height:64px}
html.shell .shellBuy{display:none;margin-top:4px}

html.shell.shell-available.shell-ph .shellBuy{display:block}
html.shell.shell-available.shell-ph #buyBtn{display:none!important}
.shellBuy .shellPh{height:56px;border-radius:var(--radius,6px);background:var(--panel,#E6DBCA);border:1px solid var(--cardBorder,#D9CBB4)}

<body>
<div class="draft" id="draft" hidden></div>
<p class="loading" id="loading">&nbsp;</p>

<main class="wrap" id="main" hidden>

        <button type="button" class="sbtn snative" id="shareBtn" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l4 4h-3v8h-2V7H8l4-4zM5 11h3v2H7v6h10v-6h-1v-2h3v10H5V11z"/></svg><span id="shareBtnTxt"></span></button>

    if(d.type==='shell'){if(window.__ppApplyShell)window.__ppApplyShell(d.page||d.slug||d.path||'');}
    else if(d.type==='payload'&&d.payload&&d.payload.ok&&d.payload.book&&Array.isArray(d.payload.editions))render(d.payload,{edition:d.edition,part:d.part,listenOnElsewhere:!!d.listenOnElsewhere,stickyTop:d.stickyTop,peekInside:!!d.peekInside});
    else if(d.type==='payload'&&d.payload&&!d.payload.ok){$('loading').textContent=d.payload.message||'';$('loading').hidden=false;postHeight();}
    else if(d.type==='cartResult')onCartResult(d);
    else if(d.type==='copyResult')onCopyResult(d);
  });
  if(window.ResizeObserver)new ResizeObserver(function(){postHeight();if(P&&part==='main')followRefresh();}).observe(document.body);
  window.addEventListener('load',postHeight);
  window.__pp={keepDates:keepDates,get qty(){return qty;}};
  send({type:'ready'});
})();
</script>
